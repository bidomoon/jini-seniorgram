name: iOS build and tests
on:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Verify Xcode and project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ios/artifacts
          xcodebuild -version | tee ios/artifacts/xcode-version.txt
          python3 - <<'PY'
          import subprocess
          version = subprocess.check_output(['xcodebuild','-version'], text=True).splitlines()[0].split()[1]
          assert int(version.split('.')[0]) >= 26, version
          PY
          python3 ios/ci/generate_project.py
          git diff --exit-code -- ios/Seniorgram.xcodeproj
          plutil -lint ios/Seniorgram/Info.plist ios/Seniorgram/Resources/PrivacyInfo.xcprivacy ios/Seniorgram.xcodeproj/project.pbxproj
      - name: Select iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))['devices']
          candidates = [(runtime,d) for runtime,rows in devices.items() if 'iOS' in runtime for d in rows if d['name'].startswith('iPhone')]
          assert candidates, 'No installed iPhone simulator runtime'
          runtime, device = sorted(candidates, key=lambda x:(x[0], x[1]['name'].endswith(' Pro'), x[1]['name']), reverse=True)[0]
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('SG_SIMULATOR='+device['udid']+'\n')
          print(runtime, device['name'], device['udid'])
          subprocess.run(['xcrun','simctl','boot',device['udid']], check=False)
          subprocess.run(['xcrun','simctl','bootstatus',device['udid'],'-b'], check=True)
          PY
      - name: Run unit and interface tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project ios/Seniorgram.xcodeproj -scheme Seniorgram -destination "platform=iOS Simulator,id=$SG_SIMULATOR" -derivedDataPath ios/DerivedData -resultBundlePath ios/artifacts/Tests.xcresult CODE_SIGNING_ALLOWED=NO test 2>&1 | tee ios/artifacts/tests.log
      - name: Compile device Release build without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project ios/Seniorgram.xcodeproj -scheme Seniorgram -configuration Release -destination 'generic/platform=iOS' -derivedDataPath ios/DeviceBuild CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ios/artifacts/device-build.log
      - name: Capture actual simulator screen
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl terminate "$SG_SIMULATOR" app.jininova.seniorgram || true
          xcrun simctl launch "$SG_SIMULATOR" app.jininova.seniorgram
          xcrun simctl io "$SG_SIMULATOR" screenshot ios/artifacts/iphone-simulator.png
          xcrun xcresulttool export attachments --path ios/artifacts/Tests.xcresult --output-path ios/artifacts/screenshots
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: seniorgram-ios-${{ github.run_number }}
          path: ios/artifacts/
          retention-days: 14
