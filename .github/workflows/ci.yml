name: Seniorgram checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: seniorgram-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - name: Voice and API regression checks (no paid API requests)
        run: |
          node --check public/studio/app.js
          node --check public/studio/voice.js
          node --check public/studio/membership.js
          node tests/voice.cjs
          node tests/commerce.cjs
          node tests/product.cjs
          node tests/api.cjs
          node tests/jobs.cjs
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
      - run: node scripts/build-netlify.mjs
