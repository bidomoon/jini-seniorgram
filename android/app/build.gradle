plugins { id 'com.android.application' }
def releaseRequired = System.getenv('ANDROID_RELEASE_REQUIRED') == 'true'
if (releaseRequired && ['ANDROID_KEYSTORE_PATH','ANDROID_KEYSTORE_PASSWORD','ANDROID_KEY_ALIAS','ANDROID_KEY_PASSWORD'].any { !System.getenv(it) }) {
 throw new GradleException('Release signing configuration is incomplete. An unsigned store candidate is not allowed.')
}
android {
 namespace 'app.jininova.seniorgram'
 compileSdk 36
 defaultConfig {
  applicationId 'app.jininova.seniorgram'
  minSdk 26
  targetSdk 36
  versionCode (System.getenv('ANDROID_VERSION_CODE') ?: '1').toInteger()
  versionName System.getenv('ANDROID_VERSION_NAME') ?: '0.1.0'
 }
 signingConfigs {
  release {
   def keyPath = System.getenv('ANDROID_KEYSTORE_PATH')
   if (keyPath) {
    storeFile file(keyPath)
    storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
    keyAlias System.getenv('ANDROID_KEY_ALIAS')
    keyPassword System.getenv('ANDROID_KEY_PASSWORD')
   }
  }
 }
 buildTypes {
  debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
  release {
   minifyEnabled false
   if (System.getenv('ANDROID_KEYSTORE_PATH')) signingConfig signingConfigs.release
  }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.3'
 implementation 'com.google.androidbrowserhelper:billing:1.2.0'
}
