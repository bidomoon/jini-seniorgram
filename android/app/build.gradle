plugins { id 'com.android.application' }
android {
 namespace 'app.jininova.seniorgram'
 compileSdk 36
 defaultConfig {
  applicationId 'app.jininova.seniorgram'
  minSdk 26
  targetSdk 36
  versionCode 1
  versionName '0.1.0'
 }
 signingConfigs {
  release {
   def keyPath = System.getenv('ANDROID_KEYSTORE_PATH')
   if (keyPath) {
    storeFile file(keyPath)
    storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
    keyAlias System.getenv('ANDROID_KEY_ALIAS')
    keyPassword System.getenv('ANDROID_KEY_PASSWORD')
   }
  }
 }
 buildTypes {
  debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
  release {
   minifyEnabled false
   if (System.getenv('ANDROID_KEYSTORE_PATH')) signingConfig signingConfigs.release
  }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.3'
 implementation 'com.google.androidbrowserhelper:billing:1.2.0'
}
